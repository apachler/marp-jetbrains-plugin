version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Bundle related Gradle dep bumps into one PR to reduce review churn.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      intellij-platform:
        patterns:
          - "org.jetbrains.intellij*"
      test:
        patterns:
          - "org.junit*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # All GitHub-owned actions in one PR — they version together.
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
