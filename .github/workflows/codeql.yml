name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesday 07:32 UTC — off-peak slot.
    - cron: '32 7 * * 3'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ['java-kotlin']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '17' }
      - uses: github/codeql-action/init@52485aec7be33610227643b0fe83936b8b5f061a # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Build for analysis
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin
      - uses: github/codeql-action/analyze@52485aec7be33610227643b0fe83936b8b5f061a # v3
        with:
          category: "/language:${{ matrix.language }}"
