name: OpenSSF Scorecard

# OpenSSF Scorecard scores the repo against a battery of security best-practice
# checks (branch protection, signed releases, pinned actions, etc.) and uploads
# the result to GitHub's Security tab. The score is also surfaced via a badge
# in the README so contributors can see the current posture at a glance.

on:
  branch_protection_rule: {}
  schedule:
    # Weekly on Tuesday at 04:17 UTC — off-peak slot.
    - cron: '17 4 * * 2'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required for uploading SARIF results to the Security tab.
      security-events: write
      # Required for the OIDC token used to publish results to the public
      # OpenSSF Scorecard API (https://api.securityscorecards.dev).
      id-token: write
      # Read-only repo metadata access for the checks themselves.
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to api.securityscorecards.dev so the badge can
          # link to the public report. Safe — only aggregated scores.
          publish_results: true

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@52485aec7be33610227643b0fe83936b8b5f061a # v3
        with:
          sarif_file: results.sarif
