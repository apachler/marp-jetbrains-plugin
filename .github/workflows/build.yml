name: Build

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref so a fresh push doesn't queue
# behind a stale one. Saves CI minutes and gives faster feedback.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Run checks (tests + plugin metadata)
        run: ./gradlew check
      - name: Verify plugin against recommended IDEs
        run: ./gradlew verifyPlugin
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/
          retention-days: 14
      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          retention-days: 30
