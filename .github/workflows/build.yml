name: Build

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

# Cancel in-progress runs for the same ref so a fresh push doesn't queue
# behind a stale one. Saves CI minutes and gives faster feedback.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run checks (tests + plugin metadata)
        run: ./gradlew check
      - name: Verify plugin against recommended IDEs
        run: ./gradlew verifyPlugin
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/
          retention-days: 14
      - name: Upload plugin distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          retention-days: 30
